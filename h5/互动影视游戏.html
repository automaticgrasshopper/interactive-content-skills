@label type2

# ---------- 互动类型三：试错循环 ----------
@label type3
@bg bg_room.jpg fade=0.8

：：门锁着，墙上有三个按钮。

@choice

- 按蓝色 => t3_right
- 按绿色 => t3_wrong

@label t3_wrong
@se se_click.mp3

@jump type3

@label t3_right
@se se_click.mp3

@bg bg_sunset.jpg fade=1.2
