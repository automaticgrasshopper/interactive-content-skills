：：【节奏验证 Demo】用对话演示常见的几种互动类型。
：：互动类型一：二选一分支（最基础）。
林晓：：放学了，要不要一起走？

@choice
- 一起走 => t1_yes
- 各回各家 => t1_no

@label t1_yes
林晓：：太好了～（好感 +1）
@jump type2

@label t1_no
林晓：：好吧，那明天见。（好感 +0）
@jump type2

# ---------- 互动类型二：多选，汇合到同一节点 ----------
@label type2
：：互动类型二：多选一。多个选项，选完汇合回主线。
林晓：：你最想去哪？

@choice
- 图书馆 => t2_join
- 天台 => t2_join
- 便利店 => t2_join
- 操场 => t2_join

@label t2_join

# ---------- 互动类型三：试错循环 ----------
@label type3
@bg bg_room.jpg fade=0.8
：：互动类型三：试错循环。选错回原点，选对才推进。
：：门锁着，墙上有三个按钮。

@choice
- 按红色 => t3_wrong
- 按蓝色 => t3_right
- 按绿色 => t3_wrong

@label t3_wrong
@se se_click.mp3
：：没反应……再试试。
@jump type3

@label t3_right
@se se_click.mp3
：：咔哒——门开了！
