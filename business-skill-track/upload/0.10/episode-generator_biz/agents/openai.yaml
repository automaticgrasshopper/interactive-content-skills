interface:
  display_name: "分集规划师（业务版）"
  short_description: "完整执行原版分集流程，再生成工程业务合同输出"
  default_prompt: "Use $episode-generator_biz 生成并检查十一字段分集结果，忠实保留用户明确要求；用户前后要求冲突时先 AskUser。每条分集记录只能是承载完整剧情的互动节点，不能同时标成选择节点；后续选择只封装一次。第一条必须是有完整剧情的 episode-001。全部校验通过后一次性提交，生成中不得向页面发布中间节点。默认不发送过程消息；平台强制要求状态时只逐字发送“正在生成中”。"
