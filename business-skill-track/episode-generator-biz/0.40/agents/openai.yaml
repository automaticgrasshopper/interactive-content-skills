interface:
  display_name: "分集规划师（业务版）"
  short_description: "生成互动分集，或按一集边界增删改已有分集节点"
  default_prompt: "Use $episode-generator-biz：初次生成先建立无编号情绪运动，把固定为2的合法最短结局路径、正式结局路线目标体量与全图实际节点数分开，允许在任一次真实选择后以独立剧情节点演出因果充分的小结局，再从真实裂缝生成可二级开扇、带差异汇合或长距离分线的因果拓扑；用户在已有分集结果上增删改节点时，只读取目标节点、直接前后集和人物资产，不用情绪脊反驳或重构用户改动，必要时仅为扩大相邻修改范围AskUser。正文使用白话、可拍动作和人物化对白，正式业务结果仍只返回九字段分集列表JSON。"
