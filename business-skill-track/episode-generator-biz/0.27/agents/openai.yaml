interface:
  display_name: "分集规划师（业务版）"
  short_description: "分阶段生成并验证互动影游分集，只返回九字段业务JSON"
  default_prompt: "Use $episode-generator-biz 保留无编号情绪运动、路线级完整故事、因果展开节点和逐节点情绪脊；阶段三必须把梗概展开为观众可直接看懂的具体场面、动作、有效阻力、人物回应、调整与结果，先写完整戏再抽取门禁证据，禁止把过程链逐条改写成动作摘要或把台词集中到场尾总结；对白以人物当下交流为主，使用现代观众一遍听懂的白话。逐集门禁和全集放行通过后才组装，route与放行剧本逐字一致，只返回完整九字段分集列表JSON。"
